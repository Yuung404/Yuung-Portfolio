# Met à jour la veille « IA et cybersécurité » du portfolio toutes les heures.
# GitHub lance outils/veille.py, puis enregistre les fichiers produits (assets/data/) s'ils ont changé.
name: Veille IA et cybersécurité

on:
  schedule:
    - cron: '17 * * * *'      # toutes les heures, à la 17e minute
  workflow_dispatch:           # bouton « Run workflow » pour lancer à la main
  push:                        # et dès que le script ou cette tâche sont modifiés
    branches: [main]
    paths:
      - 'outils/veille.py'
      - '.github/workflows/veille.yml'

permissions:
  contents: write              # nécessaire pour enregistrer les nouveaux fichiers dans le dépôt

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer les flux
        run: python outils/veille.py
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name  "veille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Veille : mise à jour automatique $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
