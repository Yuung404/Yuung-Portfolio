<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg         { fill: #020d02; }
      .grid-line  { stroke: #003a0a; stroke-width: 0.5; }
      .title-text { font-family: 'Share Tech Mono', monospace; fill: #00cc44; font-size: 13px; letter-spacing: 2px; }
      .label-text { font-family: 'Share Tech Mono', monospace; fill: #00cc44; font-size: 11px; letter-spacing: 1px; }
      .small-text { font-family: 'Share Tech Mono', monospace; fill: #00aa33; font-size: 9px; letter-spacing: 1px; }
      .dim-text   { font-family: 'Share Tech Mono', monospace; fill: #00801f; font-size: 9px; letter-spacing: 0.5px; }
      .box        { fill: rgba(0,180,60,0.06); stroke: #00aa33; stroke-width: 1.2; }
      .box-main   { fill: rgba(0,200,80,0.16); stroke: #00ee55; stroke-width: 1.8; }
      .box-alone  { fill: none; stroke: #00801f; stroke-width: 1; stroke-dasharray: 4,3; }
      .fk         { stroke: #00aa33; stroke-width: 1.1; fill: none; }
      .panel      { fill: rgba(0,60,15,0.35); stroke: #005c10; stroke-width: 1; }
      .ok         { font-family: 'Share Tech Mono', monospace; fill: #33ff77; font-size: 10px; letter-spacing: 1px; }
      .cmd        { font-family: 'Share Tech Mono', monospace; fill: #00aa33; font-size: 10px; letter-spacing: 1px; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00aa33"/>
    </marker>
  </defs>

  <!-- Fond + grille -->
  <rect class="bg" width="800" height="500"/>
  <g opacity="0.4">
    <line class="grid-line" x1="0" y1="100" x2="800" y2="100"/>
    <line class="grid-line" x1="0" y1="200" x2="800" y2="200"/>
    <line class="grid-line" x1="0" y1="300" x2="800" y2="300"/>
    <line class="grid-line" x1="0" y1="400" x2="800" y2="400"/>
    <line class="grid-line" x1="100" y1="0" x2="100" y2="500"/>
    <line class="grid-line" x1="200" y1="0" x2="200" y2="500"/>
    <line class="grid-line" x1="300" y1="0" x2="300" y2="500"/>
    <line class="grid-line" x1="400" y1="0" x2="400" y2="500"/>
    <line class="grid-line" x1="500" y1="0" x2="500" y2="500"/>
    <line class="grid-line" x1="600" y1="0" x2="600" y2="500"/>
    <line class="grid-line" x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Barre de titre -->
  <rect x="0" y="0" width="800" height="32" fill="#003a0a" opacity="0.6"/>
  <text class="title-text" x="20" y="21" filter="url(#glow)">JO 2028 — SITE WEB &amp; BACK-OFFICE PHP</text>
  <text class="dim-text" x="640" y="21">PHP 8.3 · PDO · MySQL</text>

  <!-- Anneaux olympiques stylisés -->
  <g fill="none" stroke-width="1.6" filter="url(#glow)">
    <circle cx="40" cy="64" r="11" stroke="#00cc44"/>
    <circle cx="66" cy="64" r="11" stroke="#00cc44"/>
    <circle cx="92" cy="64" r="11" stroke="#00cc44"/>
    <circle cx="53" cy="76" r="11" stroke="#00aa33"/>
    <circle cx="79" cy="76" r="11" stroke="#00aa33"/>
  </g>
  <text class="small-text" x="118" y="68">LOS ANGELES 2028 · MODÈLE RELATIONNEL (8 TABLES)</text>

  <!-- Clés étrangères -->
  <g class="fk">
    <path d="M150 238 L82 168" marker-end="url(#arr)"/>
    <path d="M150 238 L218 168" marker-end="url(#arr)"/>
    <path d="M422 238 L354 168" marker-end="url(#arr)"/>
    <path d="M422 238 L490 168" marker-end="url(#arr)"/>
    <path d="M286 352 L150 290" marker-end="url(#arr)"/>
    <path d="M286 352 L422 290" marker-end="url(#arr)"/>
  </g>

  <!-- Tables de référence -->
  <rect class="box" x="24" y="120" width="116" height="48" rx="4"/>
  <text class="label-text" x="82" y="141" text-anchor="middle">SPORT</text>
  <text class="dim-text" x="82" y="157" text-anchor="middle">id_sport · nom</text>

  <rect class="box" x="160" y="120" width="116" height="48" rx="4"/>
  <text class="label-text" x="218" y="141" text-anchor="middle">LIEU</text>
  <text class="dim-text" x="218" y="157" text-anchor="middle">id_lieu · ville</text>

  <rect class="box" x="296" y="120" width="116" height="48" rx="4"/>
  <text class="label-text" x="354" y="141" text-anchor="middle">PAYS</text>
  <text class="dim-text" x="354" y="157" text-anchor="middle">id_pays · nom</text>

  <rect class="box" x="432" y="120" width="116" height="48" rx="4"/>
  <text class="label-text" x="490" y="141" text-anchor="middle">GENRE</text>
  <text class="dim-text" x="490" y="157" text-anchor="middle">id_genre · nom</text>

  <!-- Tables dépendantes -->
  <rect class="box" x="88" y="238" width="124" height="52" rx="4"/>
  <text class="label-text" x="150" y="260" text-anchor="middle">EPREUVE</text>
  <text class="dim-text" x="150" y="277" text-anchor="middle">date · heure · lieu</text>

  <rect class="box" x="360" y="238" width="124" height="52" rx="4"/>
  <text class="label-text" x="422" y="260" text-anchor="middle">ATHLETE</text>
  <text class="dim-text" x="422" y="277" text-anchor="middle">nom · pays · genre</text>

  <!-- Table d'association -->
  <rect class="box-main" x="196" y="352" width="180" height="56" rx="4" filter="url(#glow)"/>
  <text class="label-text" x="286" y="375" text-anchor="middle">PARTICIPER</text>
  <text class="dim-text" x="286" y="393" text-anchor="middle">PK athlète + épreuve · résultat</text>

  <rect class="box-alone" x="404" y="352" width="144" height="56" rx="4"/>
  <text class="label-text" x="476" y="375" text-anchor="middle">ADMINISTRATEUR</text>
  <text class="dim-text" x="476" y="393" text-anchor="middle">login · Bcrypt</text>

  <!-- Panneau terminal : recette -->
  <rect class="panel" x="580" y="104" width="196" height="306" rx="4"/>
  <text class="cmd" x="594" y="128">&gt; lancer-tests.bat</text>
  <text class="ok" x="594" y="160">[OK] 29 tests</text>
  <text class="ok" x="594" y="186">[OK] 77 assertions</text>
  <text class="ok" x="594" y="212">[OK] 8 CRUD admin</text>
  <text class="ok" x="594" y="238">[OK] CSRF · XSS · SQLi</text>
  <text class="ok" x="594" y="264">[OK] Bcrypt</text>
  <text class="ok" x="594" y="290">[OK] InnoDB · 6 FK</text>
  <text class="ok" x="594" y="316">[OK] 7 UNIQUE</text>
  <text class="cmd" x="594" y="352">&gt; git push origin main</text>
  <text class="ok" x="594" y="378">[OK] GitHub</text>
  <text class="ok" x="594" y="400">[OK] InfinityFree</text>

  <!-- Pied -->
  <rect x="0" y="468" width="800" height="32" fill="#003a0a" opacity="0.6"/>
  <text class="small-text" x="20" y="488">BTS SIO SLAM · ÉPREUVE E6 · PROJET DE FIN D'ÉTUDES 2026</text>
  <text class="dim-text" x="600" y="488">github.com/Yuung404</text>
</svg>
