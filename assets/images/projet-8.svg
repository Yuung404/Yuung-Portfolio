<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg { fill: #020d02; } .grid-line { stroke: #003a0a; stroke-width: 0.5; }
      .title-text { font-family: 'Share Tech Mono', monospace; fill: #00cc44; font-size: 13px; letter-spacing: 2px; }
      .label-text { font-family: 'Share Tech Mono', monospace; fill: #00cc44; font-size: 11px; letter-spacing: 1px; }
      .small-text { font-family: 'Share Tech Mono', monospace; fill: #00aa33; font-size: 9px; letter-spacing: 1px; }
      .dim-text { font-family: 'Share Tech Mono', monospace; fill: #00801f; font-size: 9px; letter-spacing: 0.5px; }
      .ok { font-family: 'Share Tech Mono', monospace; fill: #33ff77; font-size: 10px; letter-spacing: 1px; }
      .warn { font-family: 'Share Tech Mono', monospace; fill: #ffcc44; font-size: 10px; letter-spacing: 1px; }
      .cmd { font-family: 'Share Tech Mono', monospace; fill: #00aa33; font-size: 10px; letter-spacing: 1px; }
      .box { fill: rgba(0,180,60,0.06); stroke: #00aa33; stroke-width: 1.2; }
      .box-main { fill: rgba(0,200,80,0.16); stroke: #00ee55; stroke-width: 1.8; }
      .panel { fill: rgba(0,60,15,0.35); stroke: #005c10; stroke-width: 1; }
      .ln { stroke: #00aa33; stroke-width: 1.1; fill: none; }
    </style>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00aa33"/></marker>
